<div class="product-detail">
    <div class="product-detail__left">
        <app-open-product-breadcrumb [product]="product"></app-open-product-breadcrumb>

        <div class="product-detail__content">
            <div class="product-detail__content__gallery">
                <ng-container *ngIf="product">
                    <app-open-product-gallery [images]="product.images"></app-open-product-gallery>
                </ng-container>
                <ng-container *ngIf="!product">
                    <div class="product-detail__gallery__slider">
                        <div class="product-detail__gallery__slider__track">
                            <div class="product-detail__gallery__slider__track-slide">
                                <span class="skeleton-text skeleton--window skeleton--full"></span>
                            </div>
                        </div>
                        <div class="product-detail__gallery__slider__thumbnails">
                            <ng-container *ngFor="let _ of [0, 1, 2]">
                                <div class="product-detail__gallery__slider__thumbnails-item">
                                    <span class="skeleton-text skeleton--window skeleton--thumb"></span>
                                </div>
                            </ng-container>
                        </div>
                    </div>
                </ng-container>
            </div>

            <div class="product-detail__content__info">
                <ng-container *ngIf="product">
                    <app-open-product-info [product]="product"></app-open-product-info>
                </ng-container>
                <ng-container *ngIf="!product">
                    <div class="product-detail__info-skeleton">
                        <div class="product-detail__info-skeleton__skeleton product-detail__info-skeleton__title"></div>
                        <div class="product-detail__info-skeleton__skeleton product-detail__info-skeleton__price"></div>
                        <div class="product-detail__info-skeleton__skeleton product-detail__info-skeleton__sku"></div>
                        <div class="product-detail__info-skeleton__skeleton product-detail__info-skeleton__description"></div>
                        <div class="product-detail__info-skeleton__skeleton product-detail__info-skeleton__cart"></div>
                    </div>
                </ng-container>
            </div>
        </div>

        <app-open-product-additional [product]="product"></app-open-product-additional>

        <ng-container *ngIf="product">
            <app-open-product-similar
                    [similarProducts]="product.similarProducts || []"
                    [similarConfig]="product.similarConfig || {}"
                    [productType]="product.type"
            ></app-open-product-similar>
        </ng-container>
        <ng-container *ngIf="!product">
            <div class="product-detail__similar-products">
                <div class="product-detail__similar-products__heading">
                    <span class="product-detail__similar-products__heading__text">Slični proizvodi</span>
                </div>
                <div class="product-detail__similar-products__list">
                    <ng-container>
                        <div class="product-detail__similar-products__list__skeleton-card">
                            <span class="skeleton-text skeleton--window skeleton--card"></span>
                        </div>
                    </ng-container>
                </div>
            </div>
        </ng-container>
    </div>

    <div class="product-detail__right">
        <app-video-box
                [thumbnail]="'images/3.png'"
                [videoSrc]="'https://www.w3schools.com/html/mov_bbb.mp4'"
        ></app-video-box>
        <app-video-box
                [thumbnail]="'images/3.png'"
                [videoSrc]="'https://www.w3schools.com/html/movie.mp4'"
        ></app-video-box>
        <app-newsletter></app-newsletter>
    </div>
</div>
