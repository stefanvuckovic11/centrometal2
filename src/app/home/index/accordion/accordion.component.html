<div class="index__left__accordion">
    <div class="index__left__accordion__header">
        <i class="index__left__accordion__header-icon fa fa-th-large"></i>
        <span class="index__left__accordion__header-text">
      Kupuj po kategoriji
    </span>
    </div>

    <ng-container *ngTemplateOutlet="recursiveList; context: { $implicit: items, level: 0 }"></ng-container>

    <ng-template #recursiveList let-list let-level="level">
        <ng-container *ngFor="let item of list">
            <div class="index__left__accordion__item" [style.paddingLeft.px]="level * 16">
                <ng-container *ngIf="item.link; else hasChildren">
                    <a [routerLink]="item.link" class="index__left__accordion__title">
                        {{ item.title }}
                    </a>
                </ng-container>

                <ng-template #hasChildren>
                    <div
                            class="index__left__accordion__title"
                            (click)="toggle(item)"
                            [class.index__left__accordion__title--clickable]="item.children?.length"
                    >
                        {{ item.title }}

                        <span
                                *ngIf="item.children?.length"
                                class="index__left__accordion__icon"
                        >
              {{ item.expanded ? '–' : '+' }}
            </span>
                    </div>

                    <div class="index__left__accordion__content" *ngIf="item.expanded">
                        <ng-container *ngIf="item.children?.length">
                            <ng-container
                                    *ngTemplateOutlet="recursiveList; context: { $implicit: item.children, level: level + 1 }"
                            ></ng-container>
                        </ng-container>
                    </div>
                </ng-template>
            </div>
        </ng-container>
    </ng-template>
</div>
